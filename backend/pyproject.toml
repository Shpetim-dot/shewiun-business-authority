[project]
name = "shewiun-business-authority-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "SQLAlchemy==2.0.41",
    "psycopg[binary]==3.2.9",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.vercel]
entrypoint = "main:app"
